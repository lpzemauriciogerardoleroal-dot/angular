<div class="login-background">
  <div class="login-container">
    <div class="logo-container">
      <img src="assets/cart-logo.svg" alt="App Logo" class="logo">
    </div>

    <div class="form-container">
      <div *ngIf="errorMessage" style="color: red; margin-bottom: 10px; text-align: center;">
        {{ errorMessage }}
      </div>

      <app-auth-input
        type="text"
        placeholder="USERNAME"
        iconPath="assets/user-icon.svg"
        [(value)]="username">
      </app-auth-input>

      <app-auth-input
        type="password"
        placeholder="PASSWORD"
        iconPath="assets/lock-icon.svg"
        [(value)]="password">
      </app-auth-input>

      <app-auth-button
        [label]="loading ? 'CARGANDO...' : 'LOGIN'"
        (onClick)="realizarLogin()">
      </app-auth-button>

      <div class="forgot-password">
        <a href="#">Forgot password?</a>
      </div>
    </div>
  </div>
</div>
