<div class="background-container">
  <div class="card">
    <h2>¿Puede entrar?</h2>

    <div class="form-group">
      <label for="edad">Edad</label>
      <input type="number" id="edad" [(ngModel)]="edad">
    </div>

    <div class="form-group checkbox-group">
      <label for="yaPago">¿Ya pagó?</label>
      <input type="checkbox" id="yaPago" [(ngModel)]="yaPago">
    </div>

    <button (click)="validarAcceso()" [disabled]="cargando">
      VALIDAR ACCESO
    </button>

    @if (errorMensaje) {
      <div class="error-text">
        {{ errorMensaje }}
      </div>
    }

    @if (exitoMensaje) {
      <div class="success-text">
        {{ exitoMensaje }}
      </div>
    }
  </div>
</div>
